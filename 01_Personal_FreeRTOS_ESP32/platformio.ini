; Project cá nhân - FreeRTOS trên ESP32 / ESP32-S3 (Arduino framework, FreeRTOS có sẵn trong ESP-IDF)
; Mặc định build cho ESP32-S3. Đổi sang ESP32 thường: chọn env esp32dev ở thanh trạng thái PlatformIO.
[platformio]
default_envs = esp32s3
; Đường dẫn project có dấu tiếng Việt làm GCC/ld trên Windows lỗi "Invalid argument"
; -> build ra thư mục không dấu trong thư mục người dùng (C:\Users\<tên>\.pio_build\...)
build_dir = ${sysenv.USERPROFILE}/.pio_build/rtos_personal

[env]
; pioarduino 55.03.30 = Arduino-ESP32 3.3.0, chạy với PlatformIO Core 6.1.18+ (bản 55.03.312 báo lỗi với Core 6.2.0-post.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
; chép firmware về .pio/wokwi/ trong project cho Wokwi
extra_scripts = post:copy_fw.py
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp32s3]
board = esp32-s3-devkitc-1
; Cắm cổng "COM"/"UART" (chip USB-UART, máy MrZ: COM6) -> 0. Cắm cổng "USB" gốc của chip (COM4) -> đổi thành 1.
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
board = esp32dev
