; Xe can bang ESP32-S3 + FreeRTOS + MLP
[platformio]
default_envs = esp32s3
; duong dan co dau tieng Viet lam ld loi tren Windows -> build ra thu muc khong dau
build_dir = ${sysenv.USERPROFILE}/.pio_build/balancebot

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=0 -DARDUINO_USB_CDC_ON_BOOT=0 -O2
